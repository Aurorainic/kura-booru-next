name: CI

on:
  push:
    branches: [main, v0.9.0]
  pull_request:
    branches: [main, v0.9.0]

# Cancel superseded runs on the same ref so a fast push doesn't queue stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # postinstall 的 `nuxt prepare` 生成 typecheck 依赖的 .nuxt tsconfig refs。
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nuxt typecheck

  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm --filter kura-booru-next-extension test

  sidecar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd sidecar
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        # 静默跳过 pytest 的绿 CI 会掩盖真实破坏——无测试收集必须显式失败。
        run: |
          cd sidecar
          # exit 5 = "no tests collected"，此处显式判失败而非伪通过。
          python -m pytest tests/ -v --tb=short

  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # check.mjs is zero-dependency and imports .ts directly — Node 24's
      # type-stripping runs it without pnpm install.
      - run: node server/platform/contract/check.mjs
