name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

# 同一 tag 重复推送不得自竞争出损坏 manifest——按 ref 加并发锁。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 仅构建 release tag（防 v-test 之类把 throwaway 推上 :latest）。
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: kura-booru-web
            context: .
            dockerfile: Dockerfile
            target: production
          - image: kura-booru-worker
            context: sidecar
            dockerfile: sidecar/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 全量历史：`git branch --contains` 需要完整提交图来验证 tag 在 main 上。
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        # 只允许 main 历史中的 commit 打 tag 触发构建，挡掉 fork/分支上的 v* tag。
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          echo "Tag $TAG -> commit $TAG_COMMIT"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $TAG ($TAG_COMMIT) is not reachable from main. Image builds are only allowed for tags on main commits."
            echo "::error::Re-tag the commit after merging it into main, or push the tag onto a main commit directly."
            exit 1
          fi
          echo "OK: tag $TAG is on main"

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          OWNER_LOWER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert production build guard
        # 根因守卫：缺失 NODE_ENV=production 会静默产出 dev 包；Dockerfile 内有 RUN test 兜底，这里提前失败。
        run: |
          grep -q '^ENV NODE_ENV=production' Dockerfile || { \
            echo "FATAL: Dockerfile build stage missing 'ENV NODE_ENV=production'"; \
            echo "Without it, nuxt build ships a dev bundle (page shows 'nuxt dev', dev badge)."; \
            exit 1; }
          echo "OK: Dockerfile pins NODE_ENV=production in build stage"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          build-args: |
            KURA_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ matrix.image }}:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: 0  # Report but don't fail — triage vulnerabilities separately
          severity: CRITICAL,HIGH
          timeout: 5m

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - kura-booru-web
          - kura-booru-worker

    steps:
      - name: Delete old untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 3
          # 只清 untagged（digest 残留）；tagged 永不清，避免删掉仍在拉取的 release。
          delete-only-untagged-versions: true
