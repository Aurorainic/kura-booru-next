# =============================================================================
# Kura Booru — Production Docker Compose (4 containers)
# Web: Nitro SSR + REST API + Bot webhook | Worker: Python gallery-dl + phash
# PostgreSQL (pg_trgm) | Redis: queue (LPUSH/BRPOP) + cache
# Deploy from infra/: docker compose --env-file ../.env -f docker-compose.yml up -d
# Images pinned by KURA_IMAGE_TAG (.env); rollback = change tag + pull + up -d;
# unset/empty tracks :latest. NOTE: --env-file is REQUIRED — `env_file` only
# injects vars into containers, not ${VAR} interpolation in this file.
# =============================================================================

# Registry prefix for custom images; KURA_IMAGE_TAG pins a release tag (default :latest)

services:
  # Web — SSR + REST API + Bot webhook (single Node process)
  web:
    image: ${KURA_IMAGE_REGISTRY:-ghcr.io/aurorainic}/kura-booru-web:${KURA_IMAGE_TAG:-latest}
    container_name: kura-web
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 256m
    pids_limit: 256
    # Linux Docker 无内置 host.docker.internal — 让容器能访问宿主机代理（127.0.0.1:19823）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kura-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Worker — Python (gallery-dl + imagehash phash); BRPOP kura:jobs → LPUSH kura:results:{id}
  worker:
    image: ${KURA_IMAGE_REGISTRY:-ghcr.io/aurorainic}/kura-booru-worker:${KURA_IMAGE_TAG:-latest}
    container_name: kura-worker
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 100
    environment:
      SIDECAR_WORKERS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kura-internal
    healthcheck:
      test: ["CMD-SHELL", "grep -q sidecar /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL 18 — primary database
  postgres:
    image: postgres:18-alpine
    container_name: kura-postgres
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    shm_size: 64m
    pids_limit: 50
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kurabooru}
      POSTGRES_USER: ${POSTGRES_USER:-kura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kura_password}
    volumes:
      - /data/postgres:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - kura-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kura} -d ${POSTGRES_DB:-kurabooru}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis 8 — queue (bare LPUSH/BRPOP) + cache
  redis:
    image: redis:8-alpine
    container_name: kura-redis
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 50
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --maxmemory-samples 5
      --save ""
      --auto-aof-rewrite-percentage 50
      --auto-aof-rewrite-min-size 32mb
    volumes:
      - /data/redis:/data
    networks:
      - kura-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# Network — internal; host reverse proxy forwards into it
networks:
  kura-internal:
    driver: bridge
